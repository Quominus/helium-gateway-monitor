<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SatTrack Gateway Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary-900: #0F172A;
      --primary-800: #1E293B;
      --primary-700: #334155;
      --primary-600: #475569;
      --primary-500: #64748B;
      --primary-400: #94A3B8;
      --primary-300: #CBD5E1;
      --primary-200: #E2E8F0;
      --primary-100: #F1F5F9;
      --primary-50: #F8FAFC;
      --accent: #E22936;
      --accent-hover: #D01E2C;
      --green: #22C55E;
      --green-bg: rgba(34,197,94,0.1);
      --red: #EF4444;
      --red-bg: rgba(239,68,68,0.1);
      --amber: #EAB308;
      --radius: 12px;
      --shadow: 0 4px 16px rgba(15,23,42,0.08);
      --shadow-lg: 0 8px 32px rgba(15,23,42,0.12);
    }

    body {
      font-family: 'Poppins', -apple-system, sans-serif;
      background: var(--primary-100);
      color: var(--primary-800);
      min-height: 100vh;
    }

    /* ---- Header ---- */
    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
      color: #fff;
      padding: 0;
      box-shadow: var(--shadow-lg);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-left h1 { font-size: 22px; font-weight: 700; }
    .header-left span { font-size: 13px; color: var(--primary-400); font-weight: 400; }
    .header-stats { display: flex; gap: 20px; }
    .stat-pill {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.08);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }
    .stat-dot {
      width: 8px; height: 8px; border-radius: 50%;
    }
    .stat-dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .stat-dot.red { background: var(--red); }
    .stat-dot.total { background: var(--primary-400); }

    /* ---- Main ---- */
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

    /* ---- Gateway Cards ---- */
    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--primary-700);
      margin-bottom: 16px;
    }
    .gateways-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .gw-card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      transition: box-shadow 0.2s, transform 0.2s;
      border-left: 4px solid var(--primary-300);
    }
    .gw-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
    .gw-card.online { border-left-color: var(--green); }
    .gw-card.offline { border-left-color: var(--red); }

    .gw-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
    .gw-name-wrap { flex: 1; min-width: 0; }
    .gw-name {
      font-size: 16px; font-weight: 600; color: var(--primary-800);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: pointer;
      padding: 2px 6px;
      margin: -2px -6px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .gw-name:hover { background: var(--primary-100); }
    .gw-name-input {
      font-family: 'Poppins', sans-serif;
      font-size: 16px; font-weight: 600;
      border: 2px solid var(--accent);
      border-radius: 6px;
      padding: 2px 6px;
      width: 100%;
      outline: none;
      color: var(--primary-800);
    }
    .gw-mac { font-size: 12px; color: var(--primary-500); margin-top: 2px; font-family: monospace; }

    .gw-status-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .gw-status-badge.online { background: var(--green-bg); color: #16a34a; }
    .gw-status-badge.offline { background: var(--red-bg); color: #dc2626; }
    .gw-status-badge .dot {
      width: 6px; height: 6px; border-radius: 50%;
    }
    .gw-status-badge.online .dot { background: var(--green); box-shadow: 0 0 4px var(--green); }
    .gw-status-badge.offline .dot { background: var(--red); }

    .gw-meta { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
    .gw-meta-item { font-size: 12px; color: var(--primary-500); }
    .gw-meta-item strong { color: var(--primary-700); font-weight: 500; }

    .gw-history-toggle {
      margin-top: 12px;
      font-size: 12px;
      color: var(--accent);
      cursor: pointer;
      font-weight: 500;
      border: none;
      background: none;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }
    .gw-history-toggle:hover { text-decoration: underline; }

    .gw-history {
      margin-top: 10px;
      max-height: 160px;
      overflow-y: auto;
      border-top: 1px solid var(--primary-200);
      padding-top: 8px;
    }
    .gw-history-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 0;
      font-size: 12px;
      color: var(--primary-600);
    }
    .gw-history-row .dot-sm {
      width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 6px;
    }
    .gw-history-row .dot-sm.online { background: var(--green); }
    .gw-history-row .dot-sm.offline { background: var(--red); }

    /* ---- Empty state ---- */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--primary-400);
    }
    .empty-state svg { margin-bottom: 16px; opacity: 0.4; }
    .empty-state p { font-size: 14px; }

    /* ---- Notifications panel ---- */
    .notify-panel {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 32px;
    }
    .notify-panel h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .notify-panel .subtitle { font-size: 13px; color: var(--primary-500); margin-bottom: 20px; }

    .notify-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 12px; font-weight: 500; color: var(--primary-600); }
    .form-group input, .form-group select {
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      padding: 8px 12px;
      border: 1px solid var(--primary-300);
      border-radius: 8px;
      color: var(--primary-800);
      outline: none;
      transition: border 0.15s;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
    .form-group input[type="email"] { min-width: 260px; }

    .checkbox-group {
      display: flex; align-items: center; gap: 16px;
      padding: 8px 0;
    }
    .checkbox-label {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--primary-700); cursor: pointer;
    }
    .checkbox-label input[type="checkbox"] {
      accent-color: var(--accent);
      width: 16px; height: 16px;
    }

    .btn {
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #E22936 0%, #c81e2b 100%);
      color: #fff;
    }
    .btn-primary:hover { background: linear-gradient(135deg, #D01E2C 0%, #b8192a 100%); transform: translateY(-1px); }
    .btn-danger {
      background: none; color: var(--red); font-size: 12px; padding: 4px 8px;
    }
    .btn-danger:hover { background: var(--red-bg); border-radius: 6px; }

    .subscribers-list { margin-top: 20px; }
    .sub-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--primary-100);
      font-size: 13px;
    }
    .sub-row:last-child { border-bottom: none; }
    .sub-email { font-weight: 500; color: var(--primary-800); }
    .sub-meta { color: var(--primary-500); font-size: 12px; }
    .sub-tags { display: flex; gap: 6px; }
    .sub-tag {
      font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500;
    }
    .sub-tag.on { background: var(--green-bg); color: #16a34a; }
    .sub-tag.off { background: var(--red-bg); color: #dc2626; }

    /* ---- Responsive ---- */
    @media (max-width: 640px) {
      .header-inner { flex-direction: column; align-items: flex-start; }
      .gateways-grid { grid-template-columns: 1fr; }
      .notify-form { flex-direction: column; }
      .form-group input[type="email"] { min-width: unset; width: 100%; }
    }

    /* ---- Animations ---- */
    @keyframes pulse-green {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
      50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
    }
    .gw-status-badge.online .dot { animation: pulse-green 2s ease-in-out infinite; }

    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ---- Toast ---- */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--primary-800); color: #fff;
      padding: 12px 20px; border-radius: 8px;
      font-size: 13px; font-weight: 500;
      box-shadow: var(--shadow-lg);
      transform: translateY(100px); opacity: 0;
      transition: all 0.3s ease;
      z-index: 200;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="header-left">
        <div>
          <h1>SatTrack Gateway Monitor</h1>
          <span>Helium LoRaWAN Network</span>
        </div>
      </div>
      <div class="header-stats" id="headerStats">
        <div class="stat-pill"><span class="stat-dot total"></span> <span id="statTotal">0</span> Total</div>
        <div class="stat-pill"><span class="stat-dot green"></span> <span id="statOnline">0</span> Online</div>
        <div class="stat-pill"><span class="stat-dot red"></span> <span id="statOffline">0</span> Offline</div>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- Gateway Cards -->
    <h3 class="section-title">Gateways</h3>
    <div class="gateways-grid" id="gatewaysGrid">
      <div class="empty-state" id="emptyState">
        <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.858 15.355-5.858 21.213 0"/>
        </svg>
        <p>No gateways connected yet.<br>Point your LoRa gateways at this server to see them here.</p>
      </div>
    </div>

    <!-- Notifications -->
    <div class="notify-panel">
      <h2>Email Notifications</h2>
      <p class="subtitle">Get notified when gateways go online or offline.</p>

      <div class="notify-form" id="notifyForm">
        <div class="form-group">
          <label>Email address</label>
          <input type="email" id="subEmail" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Gateway</label>
          <select id="subMac">
            <option value="__ALL__">All gateways</option>
          </select>
        </div>
        <div class="checkbox-group">
          <label class="checkbox-label"><input type="checkbox" id="subOnline" checked> Online</label>
          <label class="checkbox-label"><input type="checkbox" id="subOffline" checked> Offline</label>
        </div>
        <button class="btn btn-primary" onclick="addSubscriber()">Subscribe</button>
      </div>

      <div class="subscribers-list" id="subscribersList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ---- State ----
    let gateways = [];
    let subscribers = [];
    let historyCache = {};

    // ---- Toast ----
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    // ---- Fetch helpers ----
    async function fetchGateways() {
      try {
        const res = await fetch('/api/gateways');
        gateways = await res.json();
        renderGateways();
        updateStats();
        updateGatewaySelect();
      } catch (e) { console.error('Failed to fetch gateways', e); }
    }

    async function fetchSubscribers() {
      try {
        const res = await fetch('/api/subscribers');
        subscribers = await res.json();
        renderSubscribers();
      } catch (e) { console.error('Failed to fetch subscribers', e); }
    }

    async function fetchHistory(mac) {
      try {
        const res = await fetch(`/api/gateways/${mac}/history`);
        historyCache[mac] = await res.json();
        return historyCache[mac];
      } catch (e) { return []; }
    }

    // ---- Render gateways ----
    function renderGateways() {
      const grid = document.getElementById('gatewaysGrid');
      const empty = document.getElementById('emptyState');

      if (gateways.length === 0) {
        grid.innerHTML = '';
        grid.appendChild(empty);
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';
      grid.innerHTML = gateways.map(gw => {
        const status = gw.connected ? 'online' : 'offline';
        const name = gw.name || 'Unnamed Gateway';
        const lastSeen = gw.last_seen ? timeAgo(gw.last_seen) : 'Never';
        const firstSeen = gw.first_seen ? new Date(gw.first_seen).toLocaleDateString() : '—';

        return `
          <div class="gw-card ${status} fade-in" data-mac="${gw.mac}">
            <div class="gw-header">
              <div class="gw-name-wrap">
                <div class="gw-name" onclick="editName(this, '${gw.mac}')" title="Click to rename">${escHtml(name)}</div>
                <div class="gw-mac">${gw.mac}</div>
              </div>
              <span class="gw-status-badge ${status}">
                <span class="dot"></span>
                ${status}
              </span>
            </div>
            <div class="gw-meta">
              <div class="gw-meta-item"><strong>Last seen:</strong> ${lastSeen}</div>
              <div class="gw-meta-item"><strong>Since:</strong> ${firstSeen}</div>
            </div>
            <button class="gw-history-toggle" onclick="toggleHistory(this, '${gw.mac}')">Show history</button>
          </div>`;
      }).join('');
    }

    // ---- Edit gateway name ----
    function editName(el, mac) {
      const current = el.textContent;
      const input = document.createElement('input');
      input.className = 'gw-name-input';
      input.value = current === 'Unnamed Gateway' ? '' : current;
      input.placeholder = 'Enter gateway name...';
      el.replaceWith(input);
      input.focus();
      input.select();

      const save = async () => {
        const newName = input.value.trim();
        await fetch(`/api/gateways/${mac}/name`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: newName }),
        });
        showToast('Gateway name updated');
        await fetchGateways();
      };

      input.addEventListener('blur', save);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { input.blur(); }
        if (e.key === 'Escape') { fetchGateways(); }
      });
    }

    // ---- History toggle ----
    async function toggleHistory(btn, mac) {
      const card = btn.closest('.gw-card');
      const existing = card.querySelector('.gw-history');

      if (existing) {
        existing.remove();
        btn.textContent = 'Show history';
        return;
      }

      btn.textContent = 'Loading...';
      const history = await fetchHistory(mac);
      btn.textContent = 'Hide history';

      const div = document.createElement('div');
      div.className = 'gw-history fade-in';

      if (history.length === 0) {
        div.innerHTML = '<p style="font-size:12px;color:var(--primary-400);">No history yet</p>';
      } else {
        div.innerHTML = history.map(h => `
          <div class="gw-history-row">
            <span><span class="dot-sm ${h.status}"></span>${h.status}</span>
            <span>${new Date(h.timestamp + 'Z').toLocaleString()}</span>
          </div>
        `).join('');
      }

      card.appendChild(div);
    }

    // ---- Stats ----
    function updateStats() {
      const online = gateways.filter(g => g.connected).length;
      document.getElementById('statTotal').textContent = gateways.length;
      document.getElementById('statOnline').textContent = online;
      document.getElementById('statOffline').textContent = gateways.length - online;
    }

    // ---- Gateway select in subscriber form ----
    function updateGatewaySelect() {
      const sel = document.getElementById('subMac');
      const current = sel.value;
      sel.innerHTML = '<option value="__ALL__">All gateways</option>';
      gateways.forEach(gw => {
        const name = gw.name || gw.mac;
        sel.innerHTML += `<option value="${gw.mac}">${escHtml(name)}</option>`;
      });
      sel.value = current || '__ALL__';
    }

    // ---- Subscribers ----
    async function addSubscriber() {
      const email = document.getElementById('subEmail').value.trim();
      const mac = document.getElementById('subMac').value;
      const notifyOnline = document.getElementById('subOnline').checked;
      const notifyOffline = document.getElementById('subOffline').checked;

      if (!email || !email.includes('@')) {
        showToast('Please enter a valid email');
        return;
      }

      await fetch('/api/subscribers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, mac, notify_online: notifyOnline, notify_offline: notifyOffline }),
      });

      document.getElementById('subEmail').value = '';
      showToast('Subscribed successfully');
      await fetchSubscribers();
    }

    async function removeSub(id) {
      await fetch(`/api/subscribers/${id}`, { method: 'DELETE' });
      showToast('Unsubscribed');
      await fetchSubscribers();
    }

    function renderSubscribers() {
      const list = document.getElementById('subscribersList');
      if (subscribers.length === 0) {
        list.innerHTML = '<p style="font-size:13px;color:var(--primary-400);padding:8px 0;">No subscribers yet.</p>';
        return;
      }

      list.innerHTML = subscribers.map(s => {
        const gwLabel = s.mac === '__ALL__' ? 'All gateways' : (gateways.find(g => g.mac === s.mac)?.name || s.mac);
        return `
          <div class="sub-row fade-in">
            <div>
              <div class="sub-email">${escHtml(s.email)}</div>
              <div class="sub-meta">${escHtml(gwLabel)}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <div class="sub-tags">
                ${s.notify_online ? '<span class="sub-tag on">Online</span>' : ''}
                ${s.notify_offline ? '<span class="sub-tag off">Offline</span>' : ''}
              </div>
              <button class="btn btn-danger" onclick="removeSub(${s.id})">Remove</button>
            </div>
          </div>`;
      }).join('');
    }

    // ---- Helpers ----
    function escHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function timeAgo(isoStr) {
      const d = new Date(isoStr.endsWith('Z') ? isoStr : isoStr + 'Z');
      const diff = Math.floor((Date.now() - d.getTime()) / 1000);
      if (diff < 60) return `${diff}s ago`;
      if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
      return `${Math.floor(diff/86400)}d ago`;
    }

    // ---- Init & polling ----
    fetchGateways();
    fetchSubscribers();
    setInterval(fetchGateways, 15000);
    setInterval(fetchSubscribers, 60000);
  </script>
</body>
</html>

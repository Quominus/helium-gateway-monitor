<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unsubscribed — SatTrack Gateway Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; padding: 0;
      font-family: 'Poppins', -apple-system, sans-serif;
      background: #F1F5F9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(15,23,42,0.08);
      padding: 40px;
      max-width: 480px;
      text-align: center;
    }
    h1 {
      color: #1E293B;
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 12px;
    }
    p {
      color: #334155;
      font-size: 15px;
      line-height: 1.7;
      margin: 0 0 24px;
    }
    .info {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      padding: 16px 20px;
      font-size: 14px;
      color: #64748B;
      margin-bottom: 24px;
    }
    .info strong { color: #1E293B; }
    a.back-link {
      display: inline-block;
      background: linear-gradient(135deg, #E22936 0%, #c81e2b 100%);
      color: #fff;
      text-decoration: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      transition: transform 0.15s;
    }
    a.back-link:hover { transform: translateY(-1px); }
    .error-msg { color: #64748B; }
  </style>
</head>
<body>
  <div class="card">
    {% if success %}
      <h1>Unsubscribed</h1>
      <p>You've been removed from gateway alerts.</p>
      <div class="info">
        <strong>{{ email }}</strong> will no longer receive alerts for <strong>{{ gateway_name }}</strong>.
      </div>
    {% else %}
      <h1>Link Expired</h1>
      <p class="error-msg">This unsubscribe link has already been used or is no longer valid.</p>
    {% endif %}
    <a href="/" class="back-link">Back to Dashboard</a>
  </div>
</body>
</html>
